name: buildbot preflight (apple)
on: [push, workflow_dispatch]


env:
  CI: false
  CORE_ARGS: -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_CXX_FLAGS=-Wno-invalid-specialization

jobs:
  osx:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: osx-arm64, runner: macos-15,       extra: "-DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_APPLE_SILICON_PROCESSOR=arm64 -DCMAKE_SYSTEM_PROCESSOR=arm64" }
          - { name: osx-x64,   runner: macos-15-intel, extra: "-DCMAKE_OSX_ARCHITECTURES=x86_64" }
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.name }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.15"
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - run: cmake -DCMAKE_BUILD_TYPE=Release $CORE_ARGS . -Bbuild/${{ matrix.name }} ${{ matrix.extra }}
      - run: cmake --build build/${{ matrix.name }} --target citra2018_libretro --config Release -- -j$(sysctl -n hw.ncpu)
      - run: |
          f=$(find build/${{ matrix.name }} -name "citra2018_libretro.dylib" | head -1)
          echo "$f"; lipo -info "$f"; otool -L "$f" | head -5

  apple-embedded:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ios-arm64,  system: iOS,  minver: "13.0" }
          - { name: tvos-arm64, system: tvOS, minver: "13.0" }
    runs-on: macos-15
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - name: Configure (replays the ios/tvos-cmake template)
        run: |
          cmake -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_C_FLAGS="-DIOS" -DCMAKE_CXX_FLAGS="-DIOS" \
            -DIOS=ON \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.minver }} \
            -DCMAKE_SYSTEM_NAME=${{ matrix.system }} \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            $CORE_ARGS . -Bbuild/${{ matrix.name }}
      - run: cmake --build build/${{ matrix.name }} --target citra2018_libretro --config RelWithDebInfo -- -j$(sysctl -n hw.ncpu)
      - run: |
          f=$(find build/${{ matrix.name }} -name "citra2018_libretro.dylib" | head -1)
          echo "$f"; lipo -info "$f"
